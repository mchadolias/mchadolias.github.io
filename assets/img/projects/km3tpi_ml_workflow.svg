<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 760 838" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t {
      font-size: 14px;
      fill: #2A2A28;
    }
    .ts {
      font-size: 11.5px;
      fill: #6E6C64;
    }
    .th {
      font-size: 14px;
      fill: #2A2A28;
      font-weight: 500;
    }
    .tn {
      font-size: 10.5px;
      fill: #6E6C64;
    }
    .c-gray rect {
      fill: #F1EFE8;
      stroke: #9A988E;
    }
    .c-gray .th {
      fill: #2D2C29;
    }
    .c-gray .ts {
      fill: #57564F;
    }
    .c-amber rect {
      fill: #FBF0DC;
      stroke: #D2871A;
    }
    .c-amber .th {
      fill: #5A3A0A;
    }
    .c-amber .ts {
      fill: #8A5A12;
    }
    .c-teal rect {
      fill: #E1F5EE;
      stroke: #2FA982;
    }
    .c-teal .th {
      fill: #0E4231;
    }
    .c-teal .ts {
      fill: #1B6E52;
    }
    .c-purple rect {
      fill: #EEEDFE;
      stroke: #7E74D6;
    }
    .c-purple .th {
      fill: #2C2660;
    }
    .c-purple .ts {
      fill: #4B45A0;
    }
    .c-pink rect {
      fill: #FBEAF0;
      stroke: #D85F87;
    }
    .c-pink .th {
      fill: #4B1528;
    }
    .c-pink .ts {
      fill: #9C3D5D;
    }
    .arr {
      stroke: #6E6C64;
      stroke-width: 1.5;
      fill: none;
    }
    .leader {
      stroke: #6E6C64;
      stroke-width: 0.5;
      fill: none;
      stroke-dasharray: 3 3;
    }
  </style>
    <title>km3tpi ML workflow</title>
    <desc>km3tpi.ml Snakemake pipeline. Four inputs (per-model MLConfig YAML, dataset manifest, dataset metadata,
      Parquet chunks) feed prepare_split, which resolves features and assigns a by_file split, writing
      split_manifest.json; inspect_split runs a pre-training sanity check. tune runs conditionally when optuna.enabled,
      producing best_params.json and tune_history.json. fit trains the final XGBoost sklearn Pipeline into model.pkl
      plus model_metadata.json. Three downstream consumers read the model and test split: evaluate writes metrics.json,
      diagnose writes diagnostic PNGs plus index.json, and infer scores chunks per-sample. An MLflow parent run
      cross-cuts tune and fit for tracking.</desc>

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
      </marker>
    </defs>

    <!-- ============ Row 1: four inputs ============ -->
    <g class="c-gray">
      <rect x="14" y="20" width="176" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="102" y="38" text-anchor="middle" dominant-baseline="central">MLConfig YAML</text>
      <text class="ts" x="102" y="55" text-anchor="middle" dominant-baseline="central">config/ml/{model}.yaml</text>
    </g>
    <g class="c-gray">
      <rect x="200" y="20" width="176" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="288" y="38" text-anchor="middle" dominant-baseline="central">Dataset manifest</text>
      <text class="ts" x="288" y="55" text-anchor="middle" dominant-baseline="central">ml/{dataset}/manifest.json</text>
    </g>
    <g class="c-gray">
      <rect x="386" y="20" width="176" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="474" y="38" text-anchor="middle" dominant-baseline="central">Dataset metadata</text>
      <text class="ts" x="474" y="55" text-anchor="middle" dominant-baseline="central">ml/{dataset}/metadata.json</text>
    </g>
    <g class="c-gray">
      <rect x="572" y="20" width="176" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="660" y="38" text-anchor="middle" dominant-baseline="central">Parquet chunks</text>
      <text class="ts" x="660" y="55" text-anchor="middle" dominant-baseline="central">parquet/{sample}/</text>
    </g>

    <!-- converging arrows to prepare_split -->
    <line x1="102" y1="66" x2="245" y2="118" class="arr" marker-end="url(#arrow)" />
    <line x1="288" y1="66" x2="315" y2="118" class="arr" marker-end="url(#arrow)" />
    <line x1="474" y1="66" x2="395" y2="118" class="arr" marker-end="url(#arrow)" />
    <line x1="660" y1="66" x2="455" y2="118" class="arr" marker-end="url(#arrow)" />

    <!-- ============ Row 2: prepare_split + inspect_split ============ -->
    <g class="c-teal">
      <rect x="210" y="120" width="260" height="60" rx="8" stroke-width="0.5" />
      <text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">prepare_split</text>
      <text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">feature_resolver + by_file
        split</text>
    </g>

    <!-- side branch: inspect_split -->
    <g class="c-gray">
      <rect x="520" y="123" width="210" height="54" rx="8" stroke-width="0.5" />
      <text class="th" x="625" y="142" text-anchor="middle" dominant-baseline="central">inspect_split</text>
      <text class="ts" x="625" y="160" text-anchor="middle" dominant-baseline="central">pre-train sanity -&gt;
        summary.json</text>
    </g>
    <line x1="470" y1="150" x2="518" y2="150" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)" />

    <!-- split_manifest artifact chip -->
    <g class="c-gray">
      <rect x="250" y="208" width="180" height="40" rx="8" stroke-width="0.5" />
      <text class="th" x="340" y="223" text-anchor="middle" dominant-baseline="central">split_manifest.json</text>
      <text class="tn" x="340" y="238" text-anchor="middle" dominant-baseline="central">reproducibility artifact</text>
    </g>
    <line x1="340" y1="180" x2="340" y2="206" class="arr" marker-end="url(#arrow)" />

    <!-- ============ Row 3: tune (conditional) ============ -->
    <g class="c-amber">
      <rect x="210" y="270" width="260" height="160" rx="10" stroke-width="0.75" stroke-dasharray="6 4" />
      <text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">tune</text>
      <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">only when optuna.enabled</text>

      <!-- inner Optuna loop -->
      <rect x="226" y="328" width="108" height="32" rx="6" fill="none" stroke="#D2871A" stroke-width="0.5" />
      <text class="ts" x="280" y="345" text-anchor="middle" dominant-baseline="central">Sample params</text>

      <rect x="348" y="328" width="104" height="32" rx="6" fill="none" stroke="#D2871A" stroke-width="0.5" />
      <text class="ts" x="400" y="345" text-anchor="middle" dominant-baseline="central">xgb.train</text>

      <rect x="290" y="388" width="110" height="32" rx="6" fill="none" stroke="#D2871A" stroke-width="0.5" />
      <text class="ts" x="345" y="405" text-anchor="middle" dominant-baseline="central">Median pruner</text>

      <line x1="334" y1="344" x2="346" y2="344" stroke="#D2871A" stroke-width="0.5" marker-end="url(#arrow)" />
      <line x1="398" y1="360" x2="368" y2="386" stroke="#D2871A" stroke-width="0.5" marker-end="url(#arrow)" />
      <line x1="312" y1="388" x2="290" y2="362" stroke="#D2871A" stroke-width="0.5" stroke-dasharray="3 3"
        marker-end="url(#arrow)" />
    </g>
    <line x1="340" y1="248" x2="340" y2="268" class="arr" marker-end="url(#arrow)" />

    <!-- tune outputs -->
    <g class="c-gray">
      <rect x="520" y="300" width="210" height="48" rx="8" stroke-width="0.5" />
      <text class="th" x="625" y="318" text-anchor="middle" dominant-baseline="central">best_params.json</text>
      <text class="ts" x="625" y="335" text-anchor="middle" dominant-baseline="central">tune_history.json</text>
    </g>
    <line x1="470" y1="324" x2="518" y2="324" class="arr" marker-end="url(#arrow)" />

    <g class="c-gray">
      <rect x="520" y="364" width="210" height="44" rx="8" stroke-width="0.5" />
      <text class="th" x="625" y="380" text-anchor="middle" dominant-baseline="central">optuna.db</text>
      <text class="tn" x="625" y="396" text-anchor="middle" dominant-baseline="central">optional resumable study</text>
    </g>
    <line x1="470" y1="386" x2="518" y2="386" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)" />

    <!-- ============ Row 4: fit ============ -->
    <g class="c-teal">
      <rect x="210" y="468" width="260" height="58" rx="8" stroke-width="0.5" />
      <text class="th" x="340" y="488" text-anchor="middle" dominant-baseline="central">fit</text>
      <text class="ts" x="340" y="507" text-anchor="middle" dominant-baseline="central">final XGBoost -&gt; sklearn
        Pipeline</text>
    </g>
    <line x1="340" y1="430" x2="340" y2="466" class="arr" marker-end="url(#arrow)" />
    <!-- best_params feeds fit (dashed, conditional) -->
    <line x1="600" y1="348" x2="472" y2="488" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)" />

    <!-- model artifact chip -->
    <g class="c-gray">
      <rect x="250" y="554" width="180" height="44" rx="8" stroke-width="0.5" />
      <text class="th" x="340" y="570" text-anchor="middle" dominant-baseline="central">model.pkl</text>
      <text class="ts" x="340" y="586" text-anchor="middle" dominant-baseline="central">+ model_metadata.json</text>
    </g>
    <line x1="340" y1="526" x2="340" y2="552" class="arr" marker-end="url(#arrow)" />

    <!-- ============ Row 5: three downstream consumers ============ -->
    <g class="c-teal">
      <rect x="30" y="636" width="210" height="56" rx="8" stroke-width="0.5" />
      <text class="th" x="135" y="655" text-anchor="middle" dominant-baseline="central">evaluate</text>
      <text class="ts" x="135" y="673" text-anchor="middle" dominant-baseline="central">metrics on test split</text>
    </g>
    <g class="c-teal">
      <rect x="275" y="636" width="210" height="56" rx="8" stroke-width="0.5" />
      <text class="th" x="380" y="655" text-anchor="middle" dominant-baseline="central">diagnose</text>
      <text class="ts" x="380" y="673" text-anchor="middle" dominant-baseline="central">diagnostic plots</text>
    </g>
    <g class="c-teal">
      <rect x="520" y="636" width="210" height="56" rx="8" stroke-width="0.5" />
      <text class="th" x="625" y="655" text-anchor="middle" dominant-baseline="central">infer</text>
      <text class="ts" x="625" y="673" text-anchor="middle" dominant-baseline="central">per-chunk fan-out</text>
    </g>

    <!-- model chip fans out to the three consumers -->
    <line x1="320" y1="598" x2="160" y2="634" class="arr" marker-end="url(#arrow)" />
    <line x1="340" y1="598" x2="380" y2="634" class="arr" marker-end="url(#arrow)" />
    <line x1="360" y1="598" x2="600" y2="634" class="arr" marker-end="url(#arrow)" />

    <!-- ============ Row 6: outputs ============ -->
    <g class="c-gray">
      <rect x="30" y="724" width="210" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="135" y="742" text-anchor="middle" dominant-baseline="central">metrics.json</text>
      <text class="ts" x="135" y="759" text-anchor="middle" dominant-baseline="central">physical-weighted</text>
    </g>
    <g class="c-gray">
      <rect x="275" y="724" width="210" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="380" y="742" text-anchor="middle" dominant-baseline="central">diagnostics/*.png</text>
      <text class="ts" x="380" y="759" text-anchor="middle" dominant-baseline="central">4 plots + index.json</text>
    </g>
    <g class="c-gray">
      <rect x="520" y="724" width="210" height="46" rx="8" stroke-width="0.5" />
      <text class="th" x="625" y="742" text-anchor="middle" dominant-baseline="central">scored parquet</text>
      <text class="ts" x="625" y="759" text-anchor="middle" dominant-baseline="central">+ _inference_done</text>
    </g>
    <line x1="135" y1="692" x2="135" y2="722" class="arr" marker-end="url(#arrow)" />
    <line x1="380" y1="692" x2="380" y2="722" class="arr" marker-end="url(#arrow)" />
    <line x1="625" y1="692" x2="625" y2="722" class="arr" marker-end="url(#arrow)" />

    <!-- ============ MLflow cross-cut ============ -->
    <g class="c-pink">
      <rect x="20" y="290" width="168" height="140" rx="10" stroke-width="0.5" />
      <text class="th" x="104" y="312" text-anchor="middle" dominant-baseline="central">MLflow</text>
      <text class="th" x="104" y="330" text-anchor="middle" dominant-baseline="central">parent run</text>
      <text class="ts" x="104" y="360" text-anchor="middle" dominant-baseline="central">nested trials</text>
      <text class="ts" x="104" y="378" text-anchor="middle" dominant-baseline="central">metrics</text>
      <text class="ts" x="104" y="396" text-anchor="middle" dominant-baseline="central">artifacts</text>
    </g>
    <!-- dashed tracking connectors from tune and fit -->
    <line x1="208" y1="350" x2="190" y2="350" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <line x1="104" y1="430" x2="208" y2="492" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)" />

  </svg>