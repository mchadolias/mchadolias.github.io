<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="770" viewBox="0 0 680 770" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t { font-size: 14px; fill: #2a2a28; }
    .ts { font-size: 12px; fill: #6b6b66; }
    .th { font-size: 14px; fill: #2a2a28; font-weight: 500; }
    .c-gray rect { fill: #F1EFE8;   stroke: #6B6B66; }
    .c-gray .th { fill: #1F1F1D; }
    .c-gray .ts { fill: #3A3A38; }
    .c-amber rect { fill: #FDF1DC;  stroke: #B8770A; }
    .c-amber .th { fill: #3F2702; }
    .c-amber .ts { fill: #6F4604; }
    .c-teal rect { fill: #E2F5EE;   stroke: #1F8A66; }
    .c-teal .th { fill: #053024; }
    .c-teal .ts { fill: #0E5440; }
    .c-purple rect { fill: #EEEDFE; stroke: #5B53C9; }
    .c-purple .th { fill: #1F1B4B; }
    .c-purple .ts { fill: #36307C; }
    .c-pink rect { fill: #FBEAF0;   stroke: #C53A6B; }
    .c-pink .th { fill: #471427; }
    .c-pink .ts { fill: #7A2342; }
    .arr { stroke: #6b6b66; stroke-width: 1.5; fill: none; }
    .leader { stroke: #6b6b66; stroke-width: 0.5; fill: none; stroke-dasharray: 3 3; }
  </style>
<title>km3tpi preprocessing pipeline</title>
<desc>Five-stage Snakemake pipeline: prepare checkpoint, alias discovery, ROOT to Parquet convert, validate, and ml_manifest plus metadata, producing inputs for the ML layer.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5B53C9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#C53A6B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g class="c-gray">
  <rect x="260" y="30" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">DST ROOT files</text>
  <text class="ts" x="340" y="64" text-anchor="middle" dominant-baseline="central">local cluster storage</text>
</g>

<g class="c-gray">
  <rect x="40" y="30" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="120" y="48" text-anchor="middle" dominant-baseline="central">pipeline.yaml</text>
  <text class="ts" x="120" y="64" text-anchor="middle" dominant-baseline="central">samples · trees · resources</text>
</g>

<line x1="340" y1="74" x2="340" y2="106" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
  <rect x="220" y="110" width="240" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">Stage 1 — prepare</text>
  <text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">checkpoint · split files into chunks</text>
  <text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">writes chunk + discovery manifests</text>
</g>

<line x1="280" y1="170" x2="180" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="170" x2="500" y2="200" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="40" y="200" width="280" height="80" rx="8" stroke-width="0.5"/>
  <text class="th" x="180" y="220" text-anchor="middle" dominant-baseline="central">Stage 2 — discover</text>
  <text class="ts" x="180" y="238" text-anchor="middle" dominant-baseline="central">AliasDiscoverer.discover_union</text>
  <text class="ts" x="180" y="256" text-anchor="middle" dominant-baseline="central">{sample}/E_aliases.json</text>
  <text class="ts" x="180" y="272" text-anchor="middle" dominant-baseline="central">{sample}/T_aliases.json</text>
</g>

<g class="c-purple">
  <rect x="360" y="200" width="280" height="240" rx="10" stroke-width="0.5"/>
  <text class="th" x="500" y="220" text-anchor="middle" dominant-baseline="central">Stage 3 — convert (per chunk)</text>

  <rect x="380" y="236" width="240" height="36" rx="6" fill="none" stroke="#5B53C9" stroke-width="0.5"/>
  <text class="ts" x="500" y="254" text-anchor="middle" dominant-baseline="central">3a · TreeReader (uproot.dask)</text>

  <rect x="380" y="280" width="240" height="36" rx="6" fill="none" stroke="#5B53C9" stroke-width="0.5"/>
  <text class="ts" x="500" y="298" text-anchor="middle" dominant-baseline="central">3b · apply_features</text>

  <rect x="380" y="324" width="240" height="36" rx="6" fill="none" stroke="#5B53C9" stroke-width="0.5"/>
  <text class="ts" x="500" y="342" text-anchor="middle" dominant-baseline="central">3c · attach sample_type label</text>

  <rect x="380" y="368" width="240" height="36" rx="6" fill="none" stroke="#5B53C9" stroke-width="0.5"/>
  <text class="ts" x="500" y="386" text-anchor="middle" dominant-baseline="central">3d · ParquetWriter</text>

  <line x1="500" y1="272" x2="500" y2="278" stroke="#5B53C9" stroke-width="0.5" marker-end="url(#arrow-purple)"/>
  <line x1="500" y1="316" x2="500" y2="322" stroke="#5B53C9" stroke-width="0.5" marker-end="url(#arrow-purple)"/>
  <line x1="500" y1="360" x2="500" y2="366" stroke="#5B53C9" stroke-width="0.5" marker-end="url(#arrow-purple)"/>
</g>

<line x1="320" y1="248" x2="378" y2="254" class="arr" marker-end="url(#arrow)"/>

<line x1="500" y1="440" x2="500" y2="470" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
  <rect x="380" y="470" width="240" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="500" y="488" text-anchor="middle" dominant-baseline="central">parquet/{sample}/chunk_N.parquet</text>
  <text class="ts" x="500" y="504" text-anchor="middle" dominant-baseline="central">canonical data · one copy only</text>
</g>

<line x1="500" y1="514" x2="500" y2="548" class="arr" marker-end="url(#arrow)"/>

<g class="c-pink">
  <rect x="40" y="550" width="600" height="140" rx="10" stroke-width="0.5"/>
  <text class="th" x="340" y="572" text-anchor="middle" dominant-baseline="central">Stages 4–5 — validate · ml_manifest · metadata</text>

  <rect x="60" y="590" width="170" height="80" rx="6" fill="none" stroke="#C53A6B" stroke-width="0.5"/>
  <text class="th" x="145" y="608" text-anchor="middle" dominant-baseline="central">validate</text>
  <text class="ts" x="145" y="626" text-anchor="middle" dominant-baseline="central">schema consistency</text>
  <text class="ts" x="145" y="644" text-anchor="middle" dominant-baseline="central">{sample}/_validated</text>

  <rect x="255" y="590" width="170" height="80" rx="6" fill="none" stroke="#C53A6B" stroke-width="0.5"/>
  <text class="th" x="340" y="608" text-anchor="middle" dominant-baseline="central">ml_manifest</text>
  <text class="ts" x="340" y="626" text-anchor="middle" dominant-baseline="central">pointers + columns</text>
  <text class="ts" x="340" y="644" text-anchor="middle" dominant-baseline="central">ml/{dataset}/manifest.json</text>

  <rect x="450" y="590" width="170" height="80" rx="6" fill="none" stroke="#C53A6B" stroke-width="0.5"/>
  <text class="th" x="535" y="608" text-anchor="middle" dominant-baseline="central">metadata</text>
  <text class="ts" x="535" y="626" text-anchor="middle" dominant-baseline="central">counts · class balance</text>
  <text class="ts" x="535" y="644" text-anchor="middle" dominant-baseline="central">ml/{dataset}/metadata.json</text>

  <line x1="230" y1="630" x2="253" y2="630" stroke="#C53A6B" stroke-width="0.5" marker-end="url(#arrow-pink)"/>
  <line x1="425" y1="630" x2="448" y2="630" stroke="#C53A6B" stroke-width="0.5" marker-end="url(#arrow-pink)"/>
</g>

<line x1="340" y1="690" x2="340" y2="720" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink">
  <rect x="240" y="720" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="738" text-anchor="middle" dominant-baseline="central">km3tpi.ml</text>
  <text class="ts" x="340" y="754" text-anchor="middle" dominant-baseline="central">Trainer.run()</text>
</g>

<path d="M 120 74 L 120 132 L 218 132" class="leader"/>
<circle cx="218" cy="132" r="2" fill="#6b6b66"/>

<path d="M 120 300 L 120 400 L 378 400" class="leader"/>
<circle cx="378" cy="400" r="2" fill="#6b6b66"/>

<path d="M 120 620 L 58 620" class="leader"/>
<circle cx="58" cy="620" r="2" fill="#6b6b66"/>
</svg>
